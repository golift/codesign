# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2

before:
  hooks:
    - go mod tidy

# Two CGO-free binaries. signerd sits next to the YubiKey (Linux, macOS, or
# Windows); codesign is the CLI the Action and operators run. Windows PE is
# Authenticode-signed in a build hook when CODESIGN_URL is set (house
# signerd). Darwin universal binaries are Apple-signed and notarized when
# MACOS_SIGN_P12 is set (GoReleaser Pro / quill, works on Linux CI). Local
# snapshots skip both. checksums.txt is still signed keyless with cosign.
# The Docker image is a second build of the same commit (needs debian+pcscd);
# stamps use the git commit time so tarball and image version strings match.
builds:
  - id: signerd
    main: ./cmd/signerd
    binary: signerd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w
      - -X "golift.io/version.Version={{.Version}}"
      - -X "golift.io/version.BuildDate={{.CommitDate}}"
      - -X "golift.io/version.Revision={{.FullCommit}}"
      - -X "golift.io/version.Branch={{.ShortCommit}} [{{.Branch}}]"
    hooks:
      post:
        - cmd: bash .github/scripts/signexe.sh "{{ .Path }}"
  - id: codesign
    main: ./cmd/codesign
    binary: codesign
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w
      - -X "golift.io/version.Version={{.Version}}"
      - -X "golift.io/version.BuildDate={{.CommitDate}}"
      - -X "golift.io/version.Revision={{.FullCommit}}"
      - -X "golift.io/version.Branch={{.ShortCommit}} [{{.Branch}}]"
    hooks:
      post:
        - cmd: bash .github/scripts/signexe.sh "{{ .Path }}"

universal_binaries:
  - id: signerd
    ids: [signerd]
    replace: true
    name_template: signerd
  - id: codesign
    ids: [codesign]
    replace: true
    name_template: codesign

# Sign + notarize the macOS universal binaries (quill; works on Linux CI).
# Enabled only when MACOS_SIGN_P12 is set so local snapshots still work.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - signerd
        - codesign
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: signerd
    ids: [signerd]
    formats: ['tar.gz']
    name_template: 'signerd-{{ .Version }}.{{ .Os }}.{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - src: LICENSE
        dst: LICENSE.txt
  - id: codesign
    ids: [codesign]
    formats: ['tar.gz']
    name_template: 'codesign-{{ .Version }}.{{ .Os }}.{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - src: LICENSE
        dst: LICENSE.txt

checksum:
  name_template: checksums.txt

# Keyless Sigstore signature over checksums.txt. Cosign v3 writes a single
# bundle (cert + signature + transparency proof) instead of separate .pem/.sig
# files. Cosign 3 keyless verify requires an identity and issuer; without them
# the command fails before checking the blob:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/golift/codesign/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
