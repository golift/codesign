version: 2

before:
  hooks:
    - go mod tidy

# Two small CGO-free binaries. signerd runs on the box with the YubiKey
# (Linux/unRAID/Docker or a Mac); codesign runs on CI runners and laptops.
# No Windows signerd on purpose, and these artifacts are NOT
# Authenticode-signed in v1 (chicken and egg). checksums.txt is signed
# keyless with cosign (Sigstore). The Docker image is a second build of
# the same commit (needs debian+pcscd); stamps use the git commit time so
# tarball and image version strings match.
builds:
  - id: signerd
    main: ./cmd/signerd
    binary: signerd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w
      - -X "golift.io/version.Version={{.Version}}"
      - -X "golift.io/version.BuildDate={{.CommitDate}}"
      - -X "golift.io/version.Revision={{.FullCommit}}"
      - -X "golift.io/version.Branch={{.ShortCommit}} [{{.Branch}}]"
  - id: codesign
    main: ./cmd/codesign
    binary: codesign
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w
      - -X "golift.io/version.Version={{.Version}}"
      - -X "golift.io/version.BuildDate={{.CommitDate}}"
      - -X "golift.io/version.Revision={{.FullCommit}}"
      - -X "golift.io/version.Branch={{.ShortCommit}} [{{.Branch}}]"

archives:
  - id: signerd
    ids: [signerd]
    formats: ['tar.gz']
    name_template: 'signerd-{{ .Version }}.{{ .Os }}.{{ .Arch }}'
    files:
      - src: LICENSE
        dst: LICENSE.txt
  - id: codesign
    ids: [codesign]
    formats: ['tar.gz']
    name_template: 'codesign-{{ .Version }}.{{ .Os }}.{{ .Arch }}'
    files:
      - src: LICENSE
        dst: LICENSE.txt

checksum:
  name_template: checksums.txt

# Keyless Sigstore signature over checksums.txt. Cosign v3 writes a single
# bundle (cert + signature + transparency proof) instead of separate .pem/.sig
# files. Cosign 3 keyless verify requires an identity and issuer; without them
# the command fails before checking the blob:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/golift/codesign/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
