# golift/codesign example nginx site (SWAG / linuxserver.io style).
#
# Gate 1 of 2: mTLS. Clients without a certificate from your CA never reach
# signerd. Gate 2 (GitHub OIDC) lives inside signerd itself.
#
# DNS: keep sign.example.com DNS-only in Cloudflare (grey cloud). The orange
# cloud terminates TLS at Cloudflare with their certificate, which breaks
# client-certificate verification (BYO-CA mTLS is Enterprise-only).
#
# The $codesign upstream belongs in a gitignored variables file, like SWAG's
# secrets.conf pattern:
#   set $codesign http://signerd:8750;    # signerd container on this network
#
# SECURITY: never proxy to a loopback upstream (127.0.0.1). Loopback OIDC
# skip is off by default, but if allow_unauthenticated_loopback is enabled,
# a loopback upstream would hand every proxied request that free pass. Reach
# signerd over a Docker network or another non-loopback address so it sees
# the proxy's real, non-loopback IP and demands OIDC.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name sign.*;

    include /config/nginx/ssl.conf;

    # mTLS: require a client certificate issued by this CA (for example a
    # step-ca root or intermediate). No exceptions on a public hostname.
    ssl_client_certificate /config/keys/client-ca.crt;
    ssl_verify_client on;
    # step-ca issues leaf certs through an intermediate, so the chain is
    # leaf -> intermediate -> root. The default depth of 1 rejects that; allow
    # the intermediate. Raise this if your CA nests deeper.
    ssl_verify_depth 2;

    # PE/MSI uploads are large and signing takes seconds (token + timestamp
    # server round trip). Match max_body_mib in signerd.toml.
    client_max_body_size 100M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # Docker-network upstream so signerd sees a non-loopback peer and
        # still demands OIDC. Edit this line for your deploy; do not also
        # set $codesign elsewhere or the later assignment wins.
        set $codesign http://signerd:8750;

        proxy_pass $codesign;
    }
}
