name: Go Lift Code Sign
author: Go Lift
description: >-
  Authenticode-sign Windows PE/MSI files against a remote YubiKey-backed
  signing service (golift.io/codesign signerd). The calling job MUST set
  permissions: id-token: write so the action can fetch a GitHub OIDC token;
  the signing service verifies that token against its repository allowlist.
branding:
  icon: edit-3
  color: blue

inputs:
  files:
    description: >-
      Files to sign, separated by spaces or newlines. Shell globs are
      expanded. Files are replaced in place with their signed versions.
    required: true
  url:
    description: >-
      Signing service URL. Store it in a secret (CODESIGN_URL); it is also
      used as the OIDC token audience.
    required: true
  client-cert:
    description: mTLS client certificate, inline PEM. Store in a secret.
    required: false
    default: ''
  client-key:
    description: mTLS client private key, inline PEM. Store in a secret.
    required: false
    default: ''
  ca-cert:
    description: CA certificate that signed the server cert, inline PEM, if not publicly trusted.
    required: false
    default: ''
  name:
    description: Authenticode program name embedded in the signature.
    required: false
    default: ''
  website:
    description: Authenticode program URL embedded in the signature.
    required: false
    default: ''
  version:
    description: >-
      Optional golift.io/codesign CLI module version. Empty (the default)
      installs cmd/codesign from this action's checkout (GITHUB_ACTION_PATH),
      so uses: ./ and SHA-pinned refs always match the action source.
      Set only to install a published module version instead.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
    - name: install-codesign
      shell: bash
      env:
        CODESIGN_VERSION: ${{ inputs.version }}
        GOBIN: ${{ runner.temp }}/codesign-bin
      run: |
        set -euo pipefail
        mkdir -p "${GOBIN}"
        if [ -n "${CODESIGN_VERSION}" ]; then
          go install "golift.io/codesign/cmd/codesign@${CODESIGN_VERSION}"
        else
          go install "${GITHUB_ACTION_PATH}/cmd/codesign"
        fi
    - name: sign-files
      shell: bash
      env:
        CODESIGN_URL: ${{ inputs.url }}
        CODESIGN_CLIENT_CERT: ${{ inputs.client-cert }}
        CODESIGN_CLIENT_KEY: ${{ inputs.client-key }}
        CODESIGN_CA_CERT: ${{ inputs.ca-cert }}
        CODESIGN_NAME: ${{ inputs.name }}
        CODESIGN_WEBSITE: ${{ inputs.website }}
        CODESIGN_FILES: ${{ inputs.files }}
        GOBIN: ${{ runner.temp }}/codesign-bin
      # $CODESIGN_FILES is unquoted on purpose: it splits the file list and
      # expands globs. Values pass through the environment, not through
      # template interpolation, so there is no shell injection surface.
      # `--` stops the Go flag parser treating a file named -url as an option.
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        "${GOBIN}/codesign" -- $CODESIGN_FILES
